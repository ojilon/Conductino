<!DOCTYPE html>
<html lang="en" data-theme="aurora-dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Conductino Study Browser</title>
  <link rel="stylesheet" href="/css/base.css" />
  <style>
    /* Step 1 smoke layout — full chrome lands in Step 2 */
    html, body {
      margin: 0;
      height: 100%;
      background: #0f1419;
      color: #e7ecf3;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }
    #boot {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 0.75rem;
      text-align: center;
      padding: 2rem;
    }
    #boot h1 { margin: 0; font-size: 1.5rem; font-weight: 600; }
    #boot p { margin: 0; opacity: 0.75; max-width: 28rem; line-height: 1.45; }
    #boot code {
      background: #1a2330;
      padding: 0.15rem 0.4rem;
      border-radius: 4px;
      font-size: 0.85rem;
    }
    #status {
      margin-top: 1rem;
      padding: 0.75rem 1rem;
      border: 1px solid #2a3340;
      border-radius: 8px;
      background: #151b24;
      min-width: 16rem;
      font-size: 0.9rem;
    }
    button {
      margin-top: 0.5rem;
      padding: 0.45rem 1rem;
      border-radius: 6px;
      border: none;
      background: #3b82f6;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { filter: brightness(1.08); }
  </style>
</head>
<body>
  <div id="boot">
    <h1>Conductino</h1>
    <p>Wails shell is running. This replaces the broken dual-webview chrome.</p>
    <p>Step 1 of 5 — window + Go binding smoke test.</p>
    <div id="status">Checking Go bridge…</div>
    <button type="button" id="btn-ping">Ping Go</button>
  </div>
  <script src="/js/boot.js"></script>
</body>
</html>
