<!DOCTYPE html>
<html lang="en" data-theme="aurora-dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Conductino Study Browser</title>
  <link rel="stylesheet" href="css/base.css" />
</head>
<body>
  <!-- OS title bar carries the app name; no custom titlebar / win controls. -->

  <div id="tabstrip" role="tablist" aria-label="Tabs">
    <div id="tabs" class="tabs"></div>
    <button type="button" id="btn-new-tab" class="tab-new" title="New tab" aria-label="New tab">+</button>
  </div>

  <div id="toolbar">
    <div class="nav-group">
      <button type="button" id="btn-back" class="tool-btn" title="Back" aria-label="Back" disabled>◀</button>
      <button type="button" id="btn-fwd" class="tool-btn" title="Forward" aria-label="Forward" disabled>▶</button>
      <button type="button" id="btn-reload" class="tool-btn" title="Reload" aria-label="Reload">⟳</button>
    </div>

    <form id="omnibox-form" class="omnibox" autocomplete="off">
      <span class="omnibox-icon" id="omnibox-icon" title="Scheme">🔒</span>
      <input
        id="omnibox"
        type="text"
        spellcheck="false"
        autocomplete="off"
        placeholder="Search or enter address"
        aria-label="Address and search"
      />
    </form>

    <div class="tool-end">
      <button type="button" id="btn-sidebar" class="tool-btn" title="Toggle sidebar" aria-label="Toggle sidebar" aria-pressed="false">☰</button>
    </div>
  </div>

  <div id="workspace">
    <aside id="sidebar" class="sidebar" hidden aria-label="Sidebar">
      <div class="sidebar-header">
        <h2>Menu</h2>
        <button type="button" id="btn-sidebar-close" class="tool-btn" title="Close sidebar" aria-label="Close sidebar">×</button>
      </div>
      <nav class="sidebar-nav">
        <button type="button" class="sidebar-item" data-action="settings">⚙ Settings</button>
        <button type="button" class="sidebar-item" data-action="downloads">⬇ Downloads <span class="stub">soon</span></button>
        <button type="button" class="sidebar-item" data-action="bookmarks">☆ Bookmarks <span class="stub">soon</span></button>
      </nav>
      <div id="sidebar-panel" class="sidebar-panel" hidden></div>
    </aside>

    <!-- Local-only panels. Remote pages paint in the native content WebView2 above this region. -->
    <main id="content-host" class="content-host" role="main">
      <section id="welcome" class="state-panel active">
        <div class="welcome-card">
          <h1>New Tab</h1>
          <p class="muted">Search or type a URL in the address bar.</p>
          <p class="muted small">Remote pages load in the native content surface under this chrome.</p>
        </div>
      </section>

      <section id="settings-panel" class="state-panel" hidden>
        <div class="settings-card">
          <h2>Settings</h2>
          <label class="field">
            <span>Theme</span>
            <select id="setting-theme">
              <option value="aurora-dark">Aurora Dark</option>
              <option value="aurora-light">Aurora Light</option>
            </select>
          </label>
          <label class="field">
            <span>Search engine</span>
            <select id="setting-engine">
              <option value="duckduckgo">DuckDuckGo</option>
              <option value="google">Google</option>
              <option value="bing">Bing</option>
              <option value="startpage">Startpage</option>
            </select>
          </label>
          <button type="button" id="btn-settings-done" class="primary-btn">Done</button>
        </div>
      </section>

      <section id="stub-panel" class="state-panel" hidden>
        <div class="welcome-card">
          <h2 id="stub-title">Coming soon</h2>
          <p class="muted" id="stub-body">Placeholder. See docs/GUI.md.</p>
          <button type="button" id="btn-stub-back" class="primary-btn">Back</button>
        </div>
      </section>
    </main>
  </div>

  <script src="js/bridge.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
